global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "rag-ingestion-pipeline"

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "rag-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
    scrape_interval: 10s

  - job_name: "rag-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["worker:9091"]
    scrape_interval: 10s

  - job_name: "qdrant"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis:9121"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres:9187"]
